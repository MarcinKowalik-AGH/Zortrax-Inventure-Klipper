name: Verify and publish Inventure Information R25
on:
  push:
    branches: [feature/inventure-information-r25]
  workflow_dispatch:
concurrency:
  group: inventure-information-r25-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install 'cffi==1.17.1' 'greenlet==3.2.4' 'pyserial==3.5' 'jinja2==3.1.6' 'unicorn==2.1.4'
      - name: Run every host regression, including installed R24 Home and C ownership tests
        run: python -m unittest discover -s tests -v
      - name: Retain installed R24 macros, G28 and physical OLED cycle evidence
        run: python ci/check_inventure_home_r24.py --destination "$RUNNER_TEMP/r24-home"
      - name: Audit every installed operator menu and save actual OLED pixels
        run: python ci/check_inventure_menu_audit.py "$RUNNER_TEMP/r24-menu"
      - name: Compare literal Info macros, physical selections and Back navigation
        run: python ci/check_inventure_information_r25.py --klipper "$RUNNER_TEMP/r24-home/runtime" --config "$RUNNER_TEMP/r24-home/config/printer.cfg" --destination "$RUNNER_TEMP/r25-info"
      - name: Verify unchanged native configuration startup
        run: python ci/check_native_nozzle_startup.py
      - name: Run existing R23 MCU regression engines
        run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - name: Fetch hash-pinned GNU Arm 14.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output "$RUNNER_TEMP/toolchain.tar.xz" \
            'https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz'
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' '62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823' toolchain.tar.xz | sha256sum --check
          mkdir -p gcc-arm
          tar -xf toolchain.tar.xz -C gcc-arm --strip-components=1
          echo "$RUNNER_TEMP/gcc-arm/bin" >> "$GITHUB_PATH"
      - name: Assemble pinned source and compile the isolated R24 MCU overlay
        run: |
          python ci/prepare_kit.py --destination "$RUNNER_TEMP/pinned-kit"
          python ci/build_inventure_information_r25.py "$RUNNER_TEMP/pinned-kit" "$RUNNER_TEMP/r24-build"
      - name: Verify the exact compiled R25 Info application and dictionary
        run: |
          cd "$RUNNER_TEMP/r24-build"
          sha256sum --check <<'SUMS'
          0e73f15790977b71bd716e2957d866e8b35e1ffbeb6409947a6fe4ccccdf76c4  INVENTUR.IVB
          6e460b65ca082a3106b5a1a99717c3da03c9b4d3abd29e28b097a5668583fee0  klipper.bin
          07b3cf59448995235a16ba78cb548ab493a118254f6053c0d271747554094381  klipper.dict
          SUMS
      - name: Package the reviewed firmware, identity and installation instructions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r24-build"
          sha256sum INVENTUR.IVB klipper.bin klipper.dict > SHA256SUMS
          cp "$GITHUB_WORKSPACE/docs/INVENTURE_INFORMATION_R25.md" HOST_UPDATE.md
          cp "$GITHUB_WORKSPACE/docs/INVENTURE_INFORMATION_R25_RC4.md" INVENTURE_INFORMATION_R25_RC4.md
          cp "$RUNNER_TEMP/r24-home/R24_HOME_CYCLES.json" .
          cp "$RUNNER_TEMP/r24-home/R24_HOME_OLED.png" .
          cp "$RUNNER_TEMP/r24-menu/INVENTURE_MENU_AUDIT.json" .
          cp "$RUNNER_TEMP/r24-menu/INVENTURE_MENU_AUDIT.png" .
          cp "$GITHUB_WORKSPACE/docs/INVENTURE_MENU_AUDIT_R24_RC7_2026-11-26.md" MENU_AUDIT.md
          cp "$RUNNER_TEMP/r25-info/R25_INFORMATION.json" .
          cp "$RUNNER_TEMP/r25-info/R25_INFORMATION_OLED.png" .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path.cwd()
          with ZipFile(root.parent/'INVENTURE_INFORMATION_R25_BOOT17.zip','w',ZIP_DEFLATED) as out:
              for name in ('INVENTUR.IVB','klipper.bin','klipper.dict','SHA256SUMS',
                           'R24_HOME_BUILD.json','R24_HOME_CYCLES.json','R24_HOME_OLED.png','HOST_UPDATE.md',
                           'BUILD_REPORT.json','THERMAL_TEST_VERIFY.json',
                           'INVENTURE_MENU_AUDIT.json','INVENTURE_MENU_AUDIT.png','MENU_AUDIT.md',
                           'R25_INFO_BUILD.json','R25_INFORMATION.json','R25_INFORMATION_OLED.png',
                           'INVENTURE_INFORMATION_R25_RC4.md'):
                  out.write(root/name,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: INVENTURE_INFORMATION_R25_BOOT17
          path: |
            ${{ runner.temp }}/INVENTURE_INFORMATION_R25_BOOT17.zip
            ${{ runner.temp }}/r24-build/INVENTUR.IVB
            ${{ runner.temp }}/r24-build/klipper.bin
            ${{ runner.temp }}/r24-build/klipper.dict
            ${{ runner.temp }}/r24-build/SHA256SUMS
            ${{ runner.temp }}/r24-build/R24_HOME_BUILD.json
            ${{ runner.temp }}/r24-home/R24_HOME_CYCLES.json
            ${{ runner.temp }}/r24-home/R24_HOME_OLED.png
            ${{ runner.temp }}/r24-menu/INVENTURE_MENU_AUDIT.json
            ${{ runner.temp }}/r24-menu/INVENTURE_MENU_AUDIT.png
            ${{ runner.temp }}/r24-build/R25_INFO_BUILD.json
            ${{ runner.temp }}/r25-info/R25_INFORMATION.json
            ${{ runner.temp }}/r25-info/R25_INFORMATION_OLED.png
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify-build
    if: github.repository == 'MarcinKowalik-AGH/Zortrax-Inventure-Klipper' && github.ref == 'refs/heads/feature/inventure-information-r25'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: INVENTURE_INFORMATION_R25_BOOT17
          path: ${{ runner.temp }}/r24-release
      - name: Publish the checked application and matching host revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r24-release/r24-build"
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          gh release create inventure-information-r25-rc4 \
            "$RUNNER_TEMP/r24-release/INVENTURE_INFORMATION_R25_BOOT17.zip" \
            "$RUNNER_TEMP/r24-release/r24-build/INVENTUR.IVB" \
            "$RUNNER_TEMP/r24-release/r24-build/klipper.bin" \
            "$RUNNER_TEMP/r24-release/r24-build/klipper.dict" \
            "$RUNNER_TEMP/r24-release/r24-build/SHA256SUMS" \
            "$RUNNER_TEMP/r24-release/r24-build/R24_HOME_BUILD.json" \
            "$RUNNER_TEMP/r24-release/r24-home/R24_HOME_CYCLES.json" \
            "$RUNNER_TEMP/r24-release/r24-home/R24_HOME_OLED.png" \
            "$RUNNER_TEMP/r24-release/r24-menu/INVENTURE_MENU_AUDIT.json" \
            "$RUNNER_TEMP/r24-release/r24-menu/INVENTURE_MENU_AUDIT.png" \
            "$RUNNER_TEMP/r24-release/r24-build/R25_INFO_BUILD.json" \
            "$RUNNER_TEMP/r24-release/r25-info/R25_INFORMATION.json" \
            "$RUNNER_TEMP/r24-release/r25-info/R25_INFORMATION_OLED.png" \
            --target "$GITHUB_SHA" --prerelease \
            --title 'Inventure R25 RC4: quiet optional UART traffic during native homing' \
            --notes-file docs/INVENTURE_INFORMATION_R25_RC4.md
