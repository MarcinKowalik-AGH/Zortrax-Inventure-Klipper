name: Publish Inventure MCU R23 OLED candidate
on:
  push:
    branches: [feature/inventure-r23-m300-display-parity]
    paths:
      - 'service_mcu/control_r6/SOURCE_MCU/**'
      - 'service_mcu/control_r6/TESTS/**'
      - 'tests/mcu/**'
      - 'tests/test_inventure_display_r23.py'
      - 'ci/benchmark_inventure_oled_rle.py'
      - 'ci/render_inventure_r23_preview.py'
      - 'ci/package_inventure_r23.py'
      - 'docs/validation/INVENTURE_R23*.json'
      - 'docs/INVENTURE_R23_RELEASE.md'
      - 'docs/INVENTURE_R23_LEVELING_SERVICE_ENTRY.md'
      - 'inventure_bootstrap.py'
      - 'inventure_operator_service_restore.py'
      - 'inventure_leveling_ui_restore.py'
      - 'inventure_leveling_stages_restore.py'
      - 'inventure_operator_menu_restore.py'
      - 'inventure_configuration_audit_restore.py'
      - 'inventure_config_cleanup.py'
      - 'restored/configuration_audit_r23/**'
      - 'tests/test_inventure_config_audit.py'
      - 'tests/fixtures/field_config_20261125/**'
      - 'ci/check_inventure_config_audit.py'
      - 'ci/check_native_nozzle_startup.py'
      - 'docs/INVENTURE_R23_CONFIG_AUDIT.md'
      - 'inventure_bootstrap_config.py'
      - 'restored/operator_menu_r23/**'
      - 'config/INVENTURE_DASHBOARD.cfg'
      - 'setup-fluidd.py'
      - 'tests/test_orange_pi_fluidd_dashboard.py'
      - 'tests/test_inventure_operator_menu_r23.py'
      - 'ci/check_inventure_operator_menu.py'
      - 'ci/render_inventure_operator_menu.py'
      - 'docs/INVENTURE_R23_OPERATOR_MENU.md'
      - 'docs/validation/INVENTURE_OEM_MENU_R0323.json'
      - 'restored/leveling_ui_r23/**'
      - 'restored/leveling_stages_r23/**'
      - 'ci/extract_inventure_leveling_ui.py'
      - 'ci/render_inventure_leveling_preview.py'
      - 'tests/test_inventure_leveling_oled_r23.py'
      - 'docs/INVENTURE_R23_LEVELING_OLED.md'
      - 'docs/INVENTURE_R23_LEVELING_STAGES.md'
      - 'install-new-host.py'
      - 'tests/test_install_new_host.py'
      - 'ci/check_inventure_full_cycles.py'
      - 'tests/test_inventure_operator_service_r23.py'
      - 'tests/test_inventure_bootstrap.py'
      - 'tests/test_inventure_full_cycles.py'
      - '.github/workflows/inventure-r23-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cffi==1.17.1' 'greenlet==3.2.4' 'pyserial==3.5' 'jinja2==3.1.6' 'unicorn==2.1.4'
      - name: Verify the complete installed Inventure host and operator cycles
        env:
          INVENTURE_CYCLE_REPORT: ${{ runner.temp }}/r23-full-cycles.json
        run: python -m unittest discover -s tests -v
      - name: Verify installed configuration and native startup
        run: python ci/check_native_nozzle_startup.py
      - name: Render the installed OEM Inventure leveling dialogs
        run: python ci/render_inventure_leveling_preview.py "$RUNNER_TEMP/r23-leveling-preview"
      - name: Render every installed Zortrax Inventure operator menu page
        run: python ci/render_inventure_operator_menu.py "$RUNNER_TEMP/r23-menu-preview"
      - name: Validate the supplied field layout and retain the procedure audit
        run: python ci/check_inventure_config_audit.py --destination "$RUNNER_TEMP/r23-config-audit" --cycles "$RUNNER_TEMP/r23-full-cycles.json"
      - name: Verify actual R23 SPI pixels and M300 asset identity
        env:
          INVENTURE_DISPLAY_CAPTURE_DIR: ${{ runner.temp }}/r23-captures
        run: python -m unittest discover -s tests -p test_inventure_display_r23.py -v
      - name: C register and timing regression tests
        run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - name: Fetch pinned GNU Arm 14.2.1 with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --connect-timeout 20 --output toolchain.tar.xz \
            'https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz'
          printf '%s  %s\n' \
            '62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823' toolchain.tar.xz | sha256sum --check
          mkdir -p gcc-arm
          tar -xf toolchain.tar.xz -C gcc-arm --strip-components=1
          echo "$RUNNER_TEMP/gcc-arm/bin" >> "$GITHUB_PATH"
      - name: Assemble the exact pinned RC8 source kit
        shell: bash
        run: |
          set -euo pipefail
          cat source/parts/part*.bin > "$RUNNER_TEMP/pinned-kit.zip"
          printf '%s  %s\n' \
            '1c3e388744159cb10d3e27750b598a4cf434abe0b5f8029d5a8dd3b1567de3f8' "$RUNNER_TEMP/pinned-kit.zip" | sha256sum --check
          python ci/prepare_kit.py --destination "$RUNNER_TEMP/pinned-kit"
      - name: Compile and validate InventureBoot 1.7 MCU application
        shell: bash
        run: |
          set -euo pipefail
          python service_mcu/control_r6/SOURCE_MCU/build_thermal_test.py \
            "$RUNNER_TEMP/pinned-kit" "$RUNNER_TEMP/r23-build"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r23-build'
          verify=json.loads((out/'THERMAL_TEST_VERIFY.json').read_text())
          assert verify['mcu_release']=='RC8-CONTROL-R7-HOMING-R23-OLED'
          assert verify['motor_release']=='RC8-CONTROL-R7-HOMING-R23-OLED'
          assert verify['native_service_handoff_abi']==1
          assert verify['native_thermal_profile_abi']==1
          assert verify['fault_reason_abi']==1
          assert verify['scheduler_abi']==1
          assert verify['scheduler_native_hz']==10000
          assert verify['scheduler_service_hz']==20000
          assert verify['scheduler_guard_ms']==10
          assert verify['service_native_split_abi']==1
          assert verify['policy_status_abi']==1
          dictionary=json.loads((out/'klipper.dict').read_text())
          for key in ('INVENTURE_DISPLAY_ERROR_ABI','INVENTURE_LOCAL_OLED_ANIMATION_ABI',
                      'INVENTURE_LOCAL_OLED_NATIVE_GRAY4','INVENTURE_LOCAL_SPLASH_ABI'):
              assert dictionary['config'][key]==1
          assert verify['tested_on_printer'] is False
          assert (out/'INVENTUR.IVB').is_file()
          PY
          (cd "$RUNNER_TEMP/r23-build" && sha256sum INVENTUR.IVB klipper.bin klipper.dict > SHA256SUMS)
          printf '%s\n' \
            'R23.4 HOST OPERATOR MENU CANDIDATE - NEW MENU AWAITS PHYSICAL ACCEPTANCE.' \
            'Application file: INVENTUR.IVB for the existing InventureBoot 1.7.' \
            'Existing R23 MCU is byte-for-byte unchanged; no new flash is required.' \
            'R23.3 leveling UI was accepted by the operator; the expanded menu is software verified.' \
            > "$RUNNER_TEMP/r23-build/README_CANDIDATE.txt"
      - name: Verify optimized Cortex-M3 RLE stores
        run: python ci/benchmark_inventure_oled_rle.py --output "$RUNNER_TEMP/r23-build/RLE_BENCHMARK.json"
      - name: Package the exact committed candidate
        run: python ci/package_inventure_r23.py "$RUNNER_TEMP/r23-build" "$RUNNER_TEMP/r23-captures/preview" "$RUNNER_TEMP/INVENTURE_R23_MCU_OLED.zip" --leveling-previews "$RUNNER_TEMP/r23-leveling-preview" --menu-previews "$RUNNER_TEMP/r23-menu-preview" --operator-cycles "$RUNNER_TEMP/r23-full-cycles.json"
      - uses: actions/upload-artifact@v4
        with:
          name: INVENTURE_R23_OLED_CANDIDATE
          path: |
            ${{ runner.temp }}/r23-build/INVENTUR.IVB
            ${{ runner.temp }}/r23-build/klipper.bin
            ${{ runner.temp }}/r23-build/klipper.dict
            ${{ runner.temp }}/r23-build/THERMAL_TEST_VERIFY.json
            ${{ runner.temp }}/r23-build/BUILD_REPORT.json
            ${{ runner.temp }}/r23-build/SHA256SUMS
            ${{ runner.temp }}/r23-build/README_CANDIDATE.txt
            ${{ runner.temp }}/r23-build/RLE_BENCHMARK.json
            ${{ runner.temp }}/r23-captures/preview/*.png
            ${{ runner.temp }}/INVENTURE_R23_MCU_OLED.zip
            ${{ runner.temp }}/r23-full-cycles.json
            ${{ runner.temp }}/r23-leveling-preview/
            ${{ runner.temp }}/r23-menu-preview/
            ${{ runner.temp }}/r23-config-audit/INVENTURE_R23_5_CONFIG_AUDIT.json
          if-no-files-found: error
          retention-days: 14
  publish-candidate:
    needs: compile-and-validate
    if: github.repository == 'MarcinKowalik-AGH/Zortrax-Inventure-Klipper' && github.ref == 'refs/heads/feature/inventure-r23-m300-display-parity'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: INVENTURE_R23_OLED_CANDIDATE
          path: ${{ runner.temp }}/r23-release
      - name: Publish the verified Inventure candidate and application files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: inventure-r23-config-audit-rc6
          ARTIFACT_DIR: ${{ runner.temp }}/r23-release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'MarcinKowalik-AGH/Zortrax-Inventure-Klipper'
          # upload-artifact preserves the shared runner.temp directory tree.
          cd "$ARTIFACT_DIR/r23-build"
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          gh release create "$CANDIDATE_TAG" \
            "$ARTIFACT_DIR/INVENTURE_R23_MCU_OLED.zip" \
            "$ARTIFACT_DIR/r23-build/INVENTUR.IVB" \
            "$ARTIFACT_DIR/r23-build/klipper.bin" \
            "$ARTIFACT_DIR/r23-build/klipper.dict" \
            "$ARTIFACT_DIR/r23-build/SHA256SUMS" \
            "$ARTIFACT_DIR/r23-leveling-preview/OLED_LEVELING_STAGES.png" \
            "$ARTIFACT_DIR/r23-leveling-preview/INVENTURE_R23_LEVELING_PREVIEW.json" \
            "$ARTIFACT_DIR/r23-menu-preview/OLED_ZORTRAX_INVENTURE_MENU.png" \
            "$ARTIFACT_DIR/r23-menu-preview/INVENTURE_R23_OPERATOR_MENU_PREVIEW.json" \
            "$ARTIFACT_DIR/r23-full-cycles.json" \
            "$ARTIFACT_DIR/r23-config-audit/INVENTURE_R23_5_CONFIG_AUDIT.json" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'Inventure R23.5 host · startup repair and configuration audit' \
            --notes-file docs/INVENTURE_R23_CONFIG_AUDIT.md \
            --prerelease --latest=false
