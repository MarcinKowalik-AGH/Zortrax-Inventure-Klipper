name: Build Inventure STM32F207 GNU ARM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm-inventure.yml'
      - 'source/**'
      - 'ci/**'
      - 'mcu/**'
      - 'host/**'
      - 'host_core/**'
      - 'fluidd/**'
      - 'zero3/**'
      - 'tests/**'
      - 'install_rc74_oled.py'
      - 'install_rc75_oled.py'
      - 'scripts/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventure-rc7-gnu-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mcu:
    name: F207 GNU ARM 14.2 — validate, link and pack IVB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_ARCHIVE: source/INVENTURE_RC7_2_PUBLIC_GNU_ARM_SOURCE.zip
      TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source snapshot checksum; reject private dumps
        shell: bash
        run: |
          set -euo pipefail
          cat source/parts/part*.bin > "$SOURCE_ARCHIVE"
          cd source
          sha256sum -c SHA256SUMS
          cd ..
          mkdir -p kit
          unzip -q "$SOURCE_ARCHIVE" -d kit
          test ! -e kit/regression_tests/evidence/oem_reference/application_r0323.bin
          test ! -e kit/firmware/1.bin
          python - <<'PYCI'
          import zipfile
          with zipfile.ZipFile('source/INVENTURE_RC7_2_PUBLIC_GNU_ARM_SOURCE.zip') as z:
              assert z.testzip() is None
              for item in z.infolist():
                  assert not item.filename.startswith('/')
                  assert '..' not in item.filename.split('/')
                  assert item.filename != 'regression_tests/evidence/oem_reference/application_r0323.bin'
          print('PUBLIC_SOURCE_CRC_AND_NO_FULL_OEM_FIRMWARE_PASS')
          PYCI

      - name: Apply verified RC7.2 GNU ARM macro fix
        run: python ci/apply_gnu_ctr_fix.py kit

      - name: Verify dictionary against actual compiled MCU output
        run: python ci/apply_rc7_dict_fix.py kit

      - name: Install deterministic Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kit/REQUIREMENTS_MAC_TEST.txt

      - name: Download Arm GNU Toolchain 14.2.Rel1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm-toolchain"
          curl --fail --location --retry 3 --retry-all-errors             "$TOOLCHAIN_URL" --output "$RUNNER_TEMP/arm-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP/arm-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/arm-toolchain/bin/arm-none-eabi-gcc" --version
          "$RUNNER_TEMP/arm-toolchain/bin/arm-none-eabi-gcc" --print-file-name=libc_nano.a | grep -Fq '/libc_nano.a'
          test "$("$RUNNER_TEMP/arm-toolchain/bin/arm-none-eabi-gcc" -dumpfullversion)" = 14.2.1

      - name: Verify all public offline regression and P4/OLED C tests
        shell: bash
        run: |
          set -euo pipefail
          python kit/scripts/verify_release.py | tee "$RUNNER_TEMP/offline_validation.json"
          python - <<'PYCI'
          import json
          with open('/dev/null','w') as _:
              pass
          from pathlib import Path
          r=json.loads(Path('kit/VALIDATION_REPRODUCIBLE_RC7.json').read_text())
          assert r['status']=='PASS_OFFLINE_ONLY'
          assert r['source_overlay_count']==26
          assert r['unit_tests']==567
          assert r['public_source_passed']==566
          assert r['private_oem_reference_skipped']==1
          assert r['acceptance_tests']==28
          print('PUBLIC_TESTS_566_PASS_1_SKIPPED_28_ACCEPTANCE_PASS')
          PYCI

      - name: RC7.5 Klipper/M300 launcher, OLED ACK, P4 host and rollback regression
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q host install_rc75_oled.py scripts/inventure_p4_baud_stage.py
          python -m unittest discover -s tests -p 'test_rc75*.py' -v 2>&1 | tee "$RUNNER_TEMP/rc75_tests.log"
          python -m unittest discover -s tests -p 'test_rc74_ack_pump.py' -v 2>&1 | tee "$RUNNER_TEMP/rc74_ack_tests.log"
          # Run lifecycle regression against the ACTUAL RC7.5 host modules,
          # after immutable RC7.1 MCU source/regression verification.
          cp host/inventure_oled.py host/inventure_oem_menu.py host/inventure_oled_render.py kit/regression_tests/overlay/klippy/extras/
          PYTHONPATH=kit/regression_tests/tests python -m unittest discover -s kit/regression_tests/tests -p 'test_host_adapters.py' -v 2>&1 | tee "$RUNNER_TEMP/rc75_host_integration.log"
          PYTHONPATH=kit/regression_tests/tests python -m unittest discover -s kit/regression_tests/tests -p 'test_oled_lifecycle.py' -v 2>&1 | tee "$RUNNER_TEMP/rc75_oled_lifecycle.log"
          PYTHONPATH=kit/regression_tests/tests python - <<'PYCI'
          from test_host_adapters import Printer
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              p=Printer(tmp)
              p.settings['inventure_oled'].update(oem_menu=True,oem_start_screen='klipper')
              o=p.load_object(None,'inventure_oled')
              p.board_ready();p.configure();p.send_event('klippy:ready')
              assert o.oem_display_mode=='status'
              assert o._rendered_screen=='klipper_status'
              assert o.oem_menu.page=='launcher'
              assert len(o.stream.latest)==8192 and any(o.stream.latest)
              first=o.stream.latest
              o._select(0.);o._render(.01)
              assert o.oem_display_mode=='menu'
              assert o.oem_menu.view()['labels'][1:]==['Klipper','Zortrax Inventure','Serwis / Testy']
              assert o.stream.latest!=first
              o.oem_menu.move(1);o.oem_menu.move(1)
              o._select(.02);o._render(.03)
              assert o.oem_menu.page=='root'
              assert o.oem_menu.view()['labels'][1]=='Modele'
          print('REAL_HOST_RC75_STATUS_LAUNCHER_ZORTRAX_NESTED_PASS')
          PYCI
          python - <<'PYCI'
          from pathlib import Path
          import hashlib,importlib.util
          spec=importlib.util.spec_from_file_location('rc75installer','install_rc75_oled.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for name,(accepted,expected) in mod.FILES.items():
              actual=hashlib.sha256((Path('host')/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
              assert len(accepted)==1
          print('RC75_PUBLISHED_HOST_SHA256_PASS')
          PYCI

      - name: Fresh complete ARM build and image validation
        shell: bash
        run: |
          set -euo pipefail
          cd kit
          python scripts/build_firmware_on_mac.py --doctor
          python scripts/build_firmware_on_mac.py --jobs 4 --baud 250000
          find dist -name 'INVENTUR.IVB' -type f -print
          mapfile -t folders < <(find dist -mindepth 1 -maxdepth 1 -type d -name 'RC7_1_*')
          test "${#folders[@]}" -eq 1
          python scripts/verify_built_ivb.py "${folders[0]}" | tee "$RUNNER_TEMP/verify_built_ivb.json"
          echo "BUILT_FOLDER=${folders[0]}" >> "$GITHUB_ENV"

      - name: Package firmware, reports, matching host and Fluidd macros
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/MCU release/HOST release/FLUIDD release/REPORTS
          cp "kit/$BUILT_FOLDER"/{INVENTUR.IVB,INVENTURE_RC7_1_SD_BOOT16.zip,klipper.elf,klipper.bin,klipper.dict,BUILD_REPORT.json,TOOLCHAIN_RC7.json,RELEASE_RC7.json,build.config,SHA256SUMS} release/MCU/
          cp -a kit/host kit/host_core kit/zero3 kit/scripts/install_host.py release/HOST/
          # Published host modules MUST match the tested RC7.5 repo sources,
          # not the old immutable MCU build snapshot (RC7.2).
          cp host/inventure_oled.py host/inventure_oled_render.py host/inventure_oem_menu.py release/HOST/host/
          cp install_rc75_oled.py release/HOST/
          mkdir -p release/HOST/scripts
          cp scripts/inventure_p4_baud_stage.py release/HOST/scripts/
          cp docs/RC7_5_UI_M300_AND_P4_PL.md release/HOST/
          cp "$RUNNER_TEMP/rc75_tests.log" "$RUNNER_TEMP/rc74_ack_tests.log" "$RUNNER_TEMP/rc75_host_integration.log" "$RUNNER_TEMP/rc75_oled_lifecycle.log" release/REPORTS/
          cp -a kit/fluidd/. release/FLUIDD/
          cp kit/VALIDATION_REPRODUCIBLE_RC7.json release/REPORTS/
          cp "$RUNNER_TEMP/verify_built_ivb.json" release/REPORTS/
          (cd release/MCU && sha256sum -c SHA256SUMS)
          echo 'No flash, USB or serial connection was attempted.' > release/README_NOT_HARDWARE_TESTED.txt
          echo 'User needs to install a matching host and validate hardware before enabling movement/heating.' >> release/README_NOT_HARDWARE_TESTED.txt
          (cd release && find . -type f ! -name 'SHA256_ALL_FILES.txt' -print0 | sort -z | xargs -0 sha256sum) > release/SHA256_ALL_FILES.txt
          (cd release && sha256sum -c SHA256_ALL_FILES.txt)
          ls -lah release/MCU

      - name: Save verified downloadable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventure-rc7_5-host-rc7_1-mcu-gnu-arm-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
