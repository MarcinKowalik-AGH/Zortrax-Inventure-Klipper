name: Build Inventure service MCU

on:
  push:
    branches: [orange-pi-all-axis]
    paths:
      - '.github/workflows/orange-pi-mcu.yml'
      - 'service_mcu/control_r6/SOURCE_MCU/**'
      - 'service_mcu/control_r6/TESTS/**'
      - 'ci/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the service MCU against register mocks
        run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - name: Prepare the pinned source kit
        run: python ci/prepare_kit.py --destination "$RUNNER_TEMP/inventure-kit"
      - name: Install GNU Arm 14.2.Rel1
        env:
          TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm-toolchain"
          curl --fail --location --retry 3 --retry-all-errors "$TOOLCHAIN_URL" --output "$RUNNER_TEMP/arm-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP/arm-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Build and validate the InventureBoot 1.7 application
        run: |
          set -euo pipefail
          python service_mcu/control_r6/SOURCE_MCU/build_thermal_test.py "$RUNNER_TEMP/inventure-kit" "$RUNNER_TEMP/inventure-mcu"
          mkdir "$RUNNER_TEMP/inventure-sd"
          cp "$RUNNER_TEMP/inventure-mcu/"{INVENTUR.IVB,THERMAL_TEST_VERIFY.json,klipper.dict} "$RUNNER_TEMP/inventure-sd/"
          cd "$RUNNER_TEMP/inventure-sd"
          sha256sum INVENTUR.IVB THERMAL_TEST_VERIFY.json klipper.dict > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: INVENTURE_MCU_PAD_100C_BOOT17
          path: ${{ runner.temp }}/inventure-sd/
          if-no-files-found: error
