name: Build Inventure service MCU

on:
  push:
    branches: [orange-pi-all-axis]
    paths:
      - '.github/workflows/orange-pi-mcu.yml'
      - 'service_mcu/control_r6/SOURCE_MCU/**'
      - 'service_mcu/control_r6/TESTS/**'
      - 'ci/**'
      - 'source/**'
      - 'orange_pi/RELEASE.json'
      - 'docs/INVENTURE_FILAMENT_JAM_R27_1.md'
      - 'docs/AUDYT_MCU_R10_HOST_R14_2026-11-17.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the service MCU against register mocks
        run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - name: Install native configuration test dependencies
        run: python -m pip install 'cffi==1.17.1' 'greenlet==3.2.4' 'pyserial==3.5' 'jinja2==3.1.6'
      - name: Verify the complete host and updater
        run: |
          python -m unittest discover -s tests -p 'test_orange_pi*.py'
          python -m unittest discover -s tests -p 'test_jam*.py'
          python -m unittest discover -s tests -p 'test_filament_jam.py'
      - name: Reproduce and repair the real Klipper startup failure
        run: python ci/check_native_nozzle_startup.py
      - name: Prepare the pinned source kit
        run: python ci/prepare_kit.py --destination "$RUNNER_TEMP/inventure-kit"
      - name: Install GNU Arm 14.2.Rel1
        env:
          TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm-toolchain"
          curl --fail --location --retry 3 --retry-all-errors "$TOOLCHAIN_URL" --output "$RUNNER_TEMP/arm-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP/arm-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Build and validate the InventureBoot 1.7 application
        run: python service_mcu/control_r6/SOURCE_MCU/build_thermal_test.py "$RUNNER_TEMP/inventure-kit" "$RUNNER_TEMP/inventure-mcu"
      - name: Package the host and MCU release
        run: python ci/package_inventure_release.py "$RUNNER_TEMP/inventure-mcu" "$RUNNER_TEMP/inventure-release"
      - uses: actions/upload-artifact@v4
        with:
          name: INVENTURE_FILAMENT_JAM_R27_1
          path: ${{ runner.temp }}/inventure-release/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/orange-pi-all-axis'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: inventure-filament-jam-r27.1-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: INVENTURE_FILAMENT_JAM_R27_1
          path: ${{ runner.temp }}/inventure-release/
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="$(python3 -c "import json; print(json.load(open('orange_pi/RELEASE.json'))['nozzle_pad_calibration']['release_tag'])")"
          asset_dir="$RUNNER_TEMP/inventure-release"
          (cd "$asset_dir" && sha256sum --check SHA256SUMS)
          if gh release view "$release_tag" --json targetCommitish --jq .targetCommitish > "$RUNNER_TEMP/inventure-release-target"; then
            test "$(cat "$RUNNER_TEMP/inventure-release-target")" = "$GITHUB_SHA"
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --draft \
              --title "Inventure R27.1 · filament jam recovery" \
              --notes-file docs/INVENTURE_FILAMENT_JAM_R27_1.md
          fi
          gh release upload "$release_tag" "$asset_dir/"*.zip "$asset_dir/"*.md "$asset_dir/SHA256SUMS" --clobber
          gh release edit "$release_tag" --draft=false
