name: Verify Orange Pi host updater
on:
  push:
    branches: [orange-pi]
    paths:
      - 'orange_pi/**'
      - 'service_mcu/control_r6/**'
      - 'install-orange-pi.py'
      - 'tests/test_orange_pi_update.py'
      - 'tests/test_orange_pi_door_policy.py'
      - 'tests/test_orange_pi_xy_seek.py'
      - 'tests/test_orange_pi_xy_repeat.py'
      - 'tests/test_orange_pi_control.py'
      - 'tests/test_orange_pi_feeder_service.py'
      - 'tests/test_orange_pi_load_test.py'
      - 'tests/test_orange_pi_load_temperature.py'
      - 'tests/test_orange_pi_load15.py'
      - 'tests/test_orange_pi_cassette_load.py'
      - 'tests/test_orange_pi_load_stream.py'
      - 'tests/test_orange_pi_retract.py'
      - 'tests/test_orange_pi_t1_load.py'
      - 'tests/test_orange_pi_factory_core.py'
      - 'tests/test_orange_pi_factory_host.py'
      - 'tests/test_orange_pi_factory_protocol.py'
      - 'tests/test_orange_pi_procedures.py'
      - 'tests/test_orange_pi_zortrax_menu.py'
      - 'tests/test_orange_pi_oled_fast.py'
      - 'ci/benchmark_inventure_oled.py'
      - 'tests/fixtures/**'
      - '.github/workflows/orange-pi-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_orange_pi*.py' -v
      - run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - run: python ci/benchmark_inventure_oled.py --output /tmp/inventure-oled-uart-model.json
