name: Verify Orange Pi host updater
on:
  push:
    # R17 source candidates are tested without modifying the released R16 image.
    branches: [orange-pi, orange-pi-all-axis, fix/w2-r38.6-installer, fix/inventure-native-service-handoff-r17, fix/inventure-native-service-policy-r18]
    paths:
      - 'orange_pi/**'
      - 'host/inventure_filament.py'
      - 'host/inventure_consumption.py'
      - 'host/inventure_cycle.py'
      - 'host/inventure_cycle_core.py'
      - 'service_mcu/control_r6/**'
      - 'install-orange-pi.py'
      - 'install-new-host.py'
      - 'inventure_bootstrap*.py'
      - 'inventure_oled_restore.py'
      - 'restored/oled_dual_thermal_v2/**'
      - 'ci/validate_bootstrap_config.py'
      - 'tests/test_inventure_bootstrap*.py'
      - 'tests/test_install_new_host.py'
      - 'tests/test_inventure_oled_restoration.py'
      - 'tests/support/check_restored_oled.py'
      - 'tests/test_validate_bootstrap_config.py'
      - 'inventure_config_layout.py'
      - 'tests/test_inventure_config_layout.py'
      - 'ci/check_moonraker_config.py'
      - 'setup-fluidd.py'
      - 'config/*.cfg'
      - 'config/fluidd_macro_history.sha256'
      - 'fluidd/*.cfg'
      - 'tests/test_orange_pi_fluidd_dashboard.py'
      - 'tests/test_orange_pi_update.py'
      - 'tests/test_orange_pi_door_policy.py'
      - 'tests/test_orange_pi_xy_seek.py'
      - 'tests/test_orange_pi_xy_repeat.py'
      - 'tests/test_orange_pi_control.py'
      - 'tests/test_orange_pi_feeder_service.py'
      - 'tests/test_orange_pi_load_test.py'
      - 'tests/test_orange_pi_load_temperature.py'
      - 'tests/test_orange_pi_load15.py'
      - 'tests/test_orange_pi_cassette_load.py'
      - 'tests/test_orange_pi_load_stream.py'
      - 'tests/test_orange_pi_retract.py'
      - 'tests/test_orange_pi_t1_load.py'
      - 'tests/test_orange_pi_factory_core.py'
      - 'tests/test_orange_pi_factory_host.py'
      - 'tests/test_orange_pi_material_service.py'
      - 'tests/test_orange_pi_factory_protocol.py'
      - 'tests/test_orange_pi_procedures.py'
      - 'tests/test_orange_pi_z_home_core.py'
      - 'tests/test_orange_pi_z_home_host.py'
      - 'tests/test_orange_pi_zortrax_menu.py'
      - 'tests/test_orange_pi*level*.py'
      - 'tests/test_*jam*.py'
      - 'config/INVENTURE_PLATFORM_LEVEL.cfg'
      - 'config/INVENTURE_FILAMENT_JAM.cfg'
      - 'config/INVENTURE_MATERIAL.cfg'
      - 'tests/test_orange_pi_oled_fast.py'
      - 'tests/test_orange_pi_oled_graphics.py'
      - 'ci/check_oled_moonraker.py'
      - '.github/actions/check-oled-rpc/**'
      - 'ci/benchmark_inventure_oled.py'
      - 'ci/check_native_nozzle_startup.py'
      - 'tests/fixtures/**'
      - '.github/workflows/orange-pi-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The bootstrap compares every production input with the R38.6
          # source commit, which predates the installer commit under test.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cffi==1.17.1' 'greenlet==3.2.4' 'pyserial==3.5' 'jinja2==3.1.6'
      - run: python -m unittest discover -s tests -v
      - run: python ci/check_native_nozzle_startup.py
      - run: python service_mcu/control_r6/TESTS/run_mcu_tests.py
      - run: python ci/benchmark_inventure_oled.py --output /tmp/inventure-oled-uart-model.json
      - name: Check the Moonraker OLED WebSocket and Klipper socket
        uses: ./.github/actions/check-oled-rpc
