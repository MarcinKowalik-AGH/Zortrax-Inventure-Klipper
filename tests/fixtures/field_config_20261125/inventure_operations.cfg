# Inventure configuration layout v1

[gcode_macro INVENTURE_LEVEL]
description: Start five-point Inventure platform leveling
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=START

[gcode_macro INVENTURE_LEVEL_NEXT]
description: Confirm the leveling knob adjustment
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if not run.awaiting_operator %}
        {action_raise_error('No leveling adjustment to confirm')}
    {% endif %}
    INVENTURE_PLATFORM_LEVEL ACTION=NEXT RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_LEVEL_PROGRESS]
description: Show leveling progress, measurements, and adjustment instructions
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=STATUS

[gcode_macro INVENTURE_LEVEL_SAVE]
description: Save the current platform leveling result
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if run.phase != 'candidate' or not run.run_id %}
        {action_raise_error('No completed leveling result to save')}
    {% endif %}
    INVENTURE_PLATFORM_LEVEL ACTION=SAVE RUN_ID={params.RUN_ID|default(run.run_id)}

[gcode_macro INVENTURE_LEVEL_STOP]
description: Cancel platform leveling
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=CANCEL

[gcode_macro INVENTURE_DOOR_LOCK]
description: Show the global door and lid lock setting
gcode:
    INVENTURE_DOOR_POLICY MENU=1

[gcode_macro INVENTURE_JAM_STATUS]
description: Show recovery progress and filament sources for T0 and T1
gcode:
    INVENTURE_FILAMENT_JAM ACTION=STATUS

[gcode_macro INVENTURE_JAM_REPORT]
description: Report a jam on the active print nozzle and begin recovery
gcode:
    INVENTURE_FILAMENT_JAM ACTION=REPORT

[gcode_macro INVENTURE_JAM_MISSING]
description: Report missing filament on the active print nozzle
gcode:
    INVENTURE_FILAMENT_JAM ACTION=MISSING

[gcode_macro INVENTURE_JAM_BROKEN]
description: Report a visible break and clear the guide tube on the active print nozzle
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if run.active %}
        {% if 'BROKEN' not in run.allowed_actions %}
            {action_raise_error('Broken filament is unavailable at this stage')}
        {% endif %}
        INVENTURE_FILAMENT_JAM ACTION=BROKEN RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}
    {% else %}
        INVENTURE_FILAMENT_JAM ACTION=BROKEN
    {% endif %}

[gcode_macro INVENTURE_JAM_SOURCE]
description: Select the cartridge or external spool for one nozzle
gcode:
    {% set tool = params.TOOL|default('')|upper %}
    {% set source = params.SOURCE|default('')|upper %}
    {% if tool not in ['T0', 'T1'] or source not in ['CASSETTE', 'EXTERNAL', 'UNKNOWN'] %}
        {action_raise_error('Choose TOOL=T0 or T1 and SOURCE=CASSETTE, EXTERNAL or UNKNOWN')}
    {% endif %}
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if run.active %}
        INVENTURE_FILAMENT_JAM ACTION=SOURCE TOOL={tool} SOURCE={source} RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}
    {% else %}
        INVENTURE_FILAMENT_JAM ACTION=SOURCE TOOL={tool} SOURCE={source}
    {% endif %}

[gcode_macro INVENTURE_JAM_RETRY]
description: Retry the parked recovery after clearing the filament path
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if 'RETRY' not in run.allowed_actions %}
        {action_raise_error('The current jam recovery is not waiting for a retry')}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=RETRY RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_CONFIRM_FLOW]
description: Confirm visible filament flow at the nozzle for the paused print
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if 'CONFIRM' not in run.allowed_actions %}
        {action_raise_error('The current jam recovery is not waiting for flow confirmation')}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=CONFIRM RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_CANCEL]
description: End filament recovery and leave the print paused
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if 'CANCEL' not in run.allowed_actions %}
        {action_raise_error('No active jam recovery can be stopped')}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=CANCEL RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_SERVICE_TEST]
description: Test recovery on an idle printer with an explicit nozzle, source and temperature
gcode:
    {% set tool = params.TOOL|default('')|upper %}
    {% set source = params.SOURCE|default('')|upper %}
    {% set target = params.TARGET|default('')|float %}
    {% if tool not in ['T0', 'T1'] or source not in ['CASSETTE', 'EXTERNAL'] or not (180 <= target <= 310) %}
        {action_raise_error('Specify TOOL=T0 or T1, SOURCE=CASSETTE or EXTERNAL and the filament service TARGET in degrees C')}
    {% endif %}
    INVENTURE_PROCEDURE ACTION=JAM_{source} TOOL={tool} TARGET={target} SPEED_PROFILE=OEM

[gcode_macro INVENTURE_JAM_EXCHANGE]
gcode:
    INVENTURE_FILAMENT_JAM ACTION=EXCHANGE

[gcode_macro INVENTURE_JAM_UNLOAD]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "UNLOAD" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=UNLOAD RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_MORE_OUT]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "MORE_OUT" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=MORE_OUT RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_CLEARED]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "CLEARED" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=CLEARED RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_LOAD]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "LOAD" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=LOAD RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_MORE_IN]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "MORE_IN" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=MORE_IN RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_WIPE]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "WIPE" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=WIPE RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_FLOW]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "FLOW" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=FLOW RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_CONTINUE]
gcode:
    {% set run = printer.inventure_mcu.filament_jam %}
    {% if "CONTINUE" not in run.allowed_actions %}
        {action_raise_error("Unavailable at this exchange stage")}
    {% endif %}
    INVENTURE_FILAMENT_JAM ACTION=CONTINUE RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_JAM_SERVICE_STEP]
description: Run one filament replacement step on an idle printer
gcode:
    {% set tool = params.TOOL|default('')|upper %}
    {% set source = params.SOURCE|default('')|upper %}
    {% set step = params.STEP|default('')|upper %}
    {% set target = params.TARGET|default('')|float %}
    {% if tool not in ['T0','T1'] or source not in ['CASSETTE','EXTERNAL'] or step not in ['UNLOAD','LOAD','WIPE'] or not (180 <= target <= 310) %}
        {action_raise_error('Select TOOL, SOURCE, STEP=UNLOAD/LOAD/WIPE and a material service TARGET (180..310 C)')}
    {% endif %}
    {% if step == 'WIPE' %}
        INVENTURE_PROCEDURE ACTION=CLEAN TOOL={tool} TARGET={target} SPEED_PROFILE=OEM
    {% elif source == 'CASSETTE' %}
        INVENTURE_PROCEDURE ACTION={'AUTO' if step == 'LOAD' else 'UNLOAD'} TOOL={tool} TARGET={target} SPEED_PROFILE=OEM
    {% else %}
        INVENTURE_PROCEDURE ACTION=MANUAL TOOL={tool} TARGET={target} MANUAL_DIR={step} MANUAL_MM=20 FEEDER=0 SPEED_PROFILE=OEM
    {% endif %}

[gcode_macro INVENTURE_FILAMENT_SAVE]
description: Save cassette load and unload temperatures (C) and filament speeds (mm/s) for T0 or T1
gcode:
    {% set tool = params.TOOL|default('') %}
    INVENTURE_MATERIAL ACTION=SAVE TOOL={tool} {% if params.LOAD_TEMP is defined %}LOAD_TEMP={params.LOAD_TEMP}{% endif %} {% if params.LOAD_SPEED is defined %}LOAD_SPEED={params.LOAD_SPEED}{% endif %} {% if params.UNLOAD_TEMP is defined %}UNLOAD_TEMP={params.UNLOAD_TEMP}{% endif %} {% if params.UNLOAD_SPEED is defined %}UNLOAD_SPEED={params.UNLOAD_SPEED}{% endif %}

[gcode_macro INVENTURE_CASSETTE_STATUS]
description: Show both saved profiles and the current manual prompt
gcode:
    INVENTURE_MATERIAL ACTION=STATUS

[gcode_macro INVENTURE_LOAD]
description: Load the selected cassette and offer manual feeding at the waste bin
gcode:
    {% set tool = params.TOOL|default('') %}
    INVENTURE_MATERIAL ACTION=LOAD TOOL={tool} INTERACTIVE={params.INTERACTIVE|default(1)} {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %} {% if params.SPEED is defined %}SPEED={params.SPEED}{% endif %} {% if params.MATERIAL is defined %}MATERIAL={params.MATERIAL}{% endif %}

[gcode_macro INVENTURE_UNLOAD]
description: Unload the selected cassette and offer manual transport at the waste bin
gcode:
    {% set tool = params.TOOL|default('') %}
    INVENTURE_MATERIAL ACTION=UNLOAD TOOL={tool} INTERACTIVE={params.INTERACTIVE|default(1)} {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %} {% if params.SPEED is defined %}SPEED={params.SPEED}{% endif %} {% if params.MATERIAL is defined %}MATERIAL={params.MATERIAL}{% endif %}

[gcode_macro INVENTURE_FEED_MORE]
description: Feed one portion on the selected hot nozzle at the waste bin (default 5 mm)
gcode:
    {% set run = printer.inventure_mcu.material_service %}
    {% if run.prompt is none %}{action_raise_error('No cassette procedure is waiting for more filament')}{% endif %}
    INVENTURE_MATERIAL ACTION=MORE DIR=LOAD TOOL={params.TOOL|default(run.tool)} SESSION={run.session} PROMPT={run.prompt} MM={params.MM|default(5)} {% if params.SPEED is defined %}SPEED={params.SPEED}{% endif %}

[gcode_macro INVENTURE_RETRACT_MORE]
description: Retract one portion on the selected hot nozzle at the waste bin (default 5 mm)
gcode:
    {% set run = printer.inventure_mcu.material_service %}
    {% if run.prompt is none %}{action_raise_error('No cassette procedure is waiting for more filament')}{% endif %}
    INVENTURE_MATERIAL ACTION=MORE DIR=UNLOAD TOOL={params.TOOL|default(run.tool)} SESSION={run.session} PROMPT={run.prompt} MM={params.MM|default(5)} {% if params.SPEED is defined %}SPEED={params.SPEED}{% endif %}

[gcode_macro INVENTURE_FILAMENT_FINISH]
description: End the manual prompt and turn off service heaters
gcode:
    {% set run = printer.inventure_mcu.material_service %}
    {% if run.prompt is none %}{action_raise_error('No cassette procedure is waiting to finish')}{% endif %}
    INVENTURE_MATERIAL ACTION=FINISH TOOL={params.TOOL|default(run.tool)} SESSION={run.session} PROMPT={run.prompt}

[gcode_macro INVENTURE_CASSETTE_JOG]
description: Start a separate heated manual cassette move at the waste bin after a procedure has ended
gcode:
    {% set tool = params.TOOL|default('') %}
    INVENTURE_MATERIAL ACTION=JOG TOOL={tool} DIR={params.DIR|default('LOAD')} MM={params.MM|default(5)} {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %} {% if params.SPEED is defined %}SPEED={params.SPEED}{% endif %}

[gcode_macro INVENTURE_HOME_X]
description: Home X with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=X')}{% endif %}
    INVENTURE_HOME_REQUEST AXES=X {rawparams}

[gcode_macro INVENTURE_HOME_Y]
description: Home Y with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=Y')}{% endif %}
    INVENTURE_HOME_REQUEST AXES=Y {rawparams}

[gcode_macro INVENTURE_HOME_XY]
description: Home Y then X with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=XY')}{% endif %}
    INVENTURE_HOME_REQUEST AXES=XY {rawparams}

[gcode_macro INVENTURE_HOME_Z]
description: Home XY once, heat and clean T0, then establish Z on the center pad
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=Z')}{% endif %}
    INVENTURE_HOME_REQUEST AXES=Z {rawparams}

[gcode_macro INVENTURE_HOME_ALL]
description: Home XY once, heat and clean T0, then establish Z on the center pad
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=XYZ')}{% endif %}
    INVENTURE_HOME_REQUEST AXES=XYZ {rawparams}

[gcode_macro INVENTURE_NOZZLE_Z]
description: Compare the release height of T0 and T1 on the Z contact pad
gcode:
    INVENTURE_NOZZLE_Z_TEST {rawparams}

[gcode_macro INVENTURE_PAD_CALIBRATE]
description: Measure T0 and T1 XYZ offsets on the nozzle contact pad
gcode:
    {% if params.ACTION is not defined %}
        INVENTURE_NOZZLE_PAD_CALIBRATE ACTION=STATUS {rawparams}
    {% else %}
        INVENTURE_NOZZLE_PAD_CALIBRATE {rawparams}
    {% endif %}

[gcode_macro INVENTURE_NOZZLE_XY]
description: Print and evaluate the Inventure T0/T1 XY alignment patterns
gcode:
    INVENTURE_NOZZLE_XY_TEST {rawparams}

[gcode_macro INVENTURE_DIAGNOSTICS]
description: Report controller versions, panel inputs and cooling
gcode:
    INVENTURE_VERSION
    INVENTURE_PANEL_IO_STATUS
    INVENTURE_COOLING_STATUS

[gcode_macro INVENTURE_PRINTER_STATUS]
description: Show the Inventure controller state
gcode:
    INVENTURE_STATUS

[gcode_macro INVENTURE_PROCEDURES]
description: List the OEM procedures and show the current menu prompt
gcode:
    INVENTURE_PROCEDURE ACTION=LIST
    INVENTURE_ZORTRAX OP=STATUS

[gcode_macro INVENTURE_HELP]
description: Open Inventure help
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=help PROMPT=1

[gcode_macro INVENTURE_FANS]
description: Read all six fan outputs, tachometers and the cooling policy
gcode:
    INVENTURE_PANEL_IO_STATUS
    INVENTURE_COOLING_STATUS

[gcode_macro INVENTURE_FAN_TEST_START]
description: Choose an Inventure fan on the OLED or through the menu controls
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=fan_test

[gcode_macro INVENTURE_FAN_TEST_END]
description: End the test and return fan outputs to their controller
gcode:
    INVENTURE_ZORTRAX OP=FAN_END

[gcode_macro INVENTURE_FAN_CHANNEL]
description: Inspect or test a numbered fan and record an observation
gcode:
    {% set action = params.ACTION|default('STATUS')|upper %}
    {% if action == 'STATUS' %}
        INVENTURE_FAN_MANUAL_STATUS
    {% else %}
        INVENTURE_FAN_MANUAL CHANNEL={params.CHANNEL} ACTION={action} ACK={params.ACK|default('')}
    {% endif %}

[gcode_macro INVENTURE_CHANGE]
description: Open idle replacement steps or exchange the active print filament
gcode:
    {% if printer.inventure_mcu.filament_jam.active or (printer.print_stats is defined and printer.print_stats.state in ['printing','paused']) %}
        INVENTURE_JAM_EXCHANGE
    {% else %}
        INVENTURE_ZORTRAX OP=EXCHANGE_STEPS
    {% endif %}

[gcode_macro INVENTURE_HEAT]
description: Heat or hold a nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=heat_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_CLEAN]
description: Wipe the selected nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=clean_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_NOZZLE_PURGE]
description: Purge and clean the selected nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=purge_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_NOZZLE_SELECT]
description: Select the working nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=select_{tool|lower}

[gcode_macro INVENTURE_MENU_CONFIRM]
description: Confirm the current OLED prompt with its token
gcode:
    INVENTURE_ZORTRAX OP=CONFIRM TOKEN={params.TOKEN}

[gcode_macro INVENTURE_MENU_CHOOSE]
description: Choose a numbered option from the current OLED prompt
gcode:
    INVENTURE_ZORTRAX OP=CHOOSE TOKEN={params.TOKEN} INDEX={params.INDEX}

[gcode_macro INVENTURE_MENU_BACK]
description: Go back one menu step
gcode:
    INVENTURE_ZORTRAX OP=BACK

[gcode_macro INVENTURE_LIGHT]
description: Set the three-bit chamber light mask (0 off, 7 white)
gcode:
    {% if 'MASK' in params %}
        INVENTURE_RGB MASK={params.MASK}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=light PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_MAIN_MENU]
description: Open the shared Inventure main menu in Fluidd and on the OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=root

[gcode_macro INVENTURE_SETTINGS]
description: Open the settings page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=settings

[gcode_macro INVENTURE_INFORMATION]
description: Open the information page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=information

[gcode_macro INVENTURE_LANGUAGE]
description: Open the language page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=language

[gcode_macro INVENTURE_MODELS]
description: Browse the current virtual SD files through the menu
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=sd_browser PROMPT=1

[gcode_macro INVENTURE_MODELS_SORT]
description: Select file sorting by date, name or size
gcode:
    {% set order = params.ORDER|default('')|lower %}
    {% if order in ['asc','desc','name','size'] %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=sort_{order}
    {% elif order %}
        {action_raise_error('Choose ORDER=ASC, DESC, NAME or SIZE')}
    {% else %}
        INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=sorting
    {% endif %}

[gcode_macro INVENTURE_SCREEN]
description: Wake the physical OLED and report its current state
gcode:
    INVENTURE_DISPLAY_CONTROL WAKE=1
    INVENTURE_MENU_STATUS

[gcode_macro INVENTURE_OLED_BRIGHTNESS]
description: Read or save the awake OLED brightness, from 1 to 16
gcode:
    {% if 'LEVEL' in params %}
        INVENTURE_DISPLAY_CONTROL LEVEL={params.LEVEL}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_brightness PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_OLED_ICONS]
description: Browse the project animations on the Inventure OLED and Fluidd
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=oled_icons PROMPT=1 {% if params.NAME|default('') %}NAME={params.NAME}{% endif %}

[gcode_macro INVENTURE_SLEEP_MODE]
description: Read or save the OLED sleep setting
gcode:
    {% if 'ENABLED' in params %}
        INVENTURE_DISPLAY_CONTROL ENABLED={params.ENABLED}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_sleep_mode PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_OLED_TIMERS]
description: Set OLED dim and sleep times in minutes, or legacy idle and notice in seconds
gcode:
    {% if 'DIM' in params or 'SLEEP' in params or 'IDLE' in params or 'NOTICE' in params %}
        INVENTURE_DISPLAY_CONTROL {% if 'DIM' in params %}DIM={params.DIM}{% endif %} {% if 'SLEEP' in params %}SLEEP={params.SLEEP}{% endif %} {% if 'IDLE' in params %}IDLE={params.IDLE}{% endif %} {% if 'NOTICE' in params %}NOTICE={params.NOTICE}{% endif %}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_timers PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_PLATFORM_UP]
description: Move the referenced platform up after confirmation (mm and mm/s)
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=platform_up DISTANCE={params.DISTANCE|default(1)} SPEED={params.SPEED|default(1)}

[gcode_macro INVENTURE_PLATFORM_DOWN]
description: Move the referenced platform down after confirmation (mm and mm/s)
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=platform_down DISTANCE={params.DISTANCE|default(1)} SPEED={params.SPEED|default(1)}

[gcode_macro OLED_TIMERS]
description: Open the OLED timers or set DIM/SLEEP (minutes) or IDLE/NOTICE (seconds)
gcode:
    INVENTURE_OLED_TIMERS {% if "DIM" in params %}DIM={params.DIM}{% endif %} {% if "SLEEP" in params %}SLEEP={params.SLEEP}{% endif %} {% if "IDLE" in params %}IDLE={params.IDLE}{% endif %} {% if "NOTICE" in params %}NOTICE={params.NOTICE}{% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the active print through Klipper and switch off the native heaters
rename_existing: _INVENTURE_CANCEL_BASE
gcode:
    _INVENTURE_CANCEL_BASE {rawparams}
    TURN_OFF_HEATERS

[gcode_macro END_PRINT]
description: Finish buffered native motion and turn off native print heaters and part cooling
gcode:
    INVENTURE_NATIVE_END

[gcode_macro M141]
description: Set both chamber zone targets
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)}

[gcode_macro M191]
description: Set both chamber zones and wait for both to heat
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)} WAIT=1

[gcode_macro INVENTURE_DIAG_VERSIONS]
description: MCU firmware version, bootloader, and UART P4 settings
gcode:
    INVENTURE_VERSION

[gcode_macro INVENTURE_DIAG_STATUS]
description: MCU status, faults, ADC readings, fans, UART, and inputs
gcode:
    INVENTURE_STATUS

[gcode_macro INVENTURE_DIAG_INPUTS]
description: Read the 16 inputs and button states
gcode:
    INVENTURE_INPUTS

[gcode_macro INVENTURE_DIAG_RFID_UART]
description: Read the cartridge UART channels and error counters
gcode:
    INVENTURE_RFID_STATUS

[gcode_macro INVENTURE_DISPLAY_STATUS]
description: Show OLED session, acknowledgments, faults, and queues
gcode:
    INVENTURE_OLED_STATUS

[gcode_macro INVENTURE_DISPLAY_MENU]
description: Show the current OEM menu page and selection
gcode:
    INVENTURE_MENU_STATUS

[gcode_macro INVENTURE_DISPLAY_TEXT_TEST]
description: Display test text on the OLED
gcode:
    INVENTURE_OLED_TEXT LINE1=INVENTURE LINE2=RC7_TEST

[gcode_macro INVENTURE_DISPLAY_REINIT]
description: Restart the host OLED session
gcode:
    INVENTURE_OLED_REINIT

[gcode_macro INVENTURE_CAL_LEVELING]
description: Show platform leveling status
gcode:
    {% if 'INVENTURE_LEVEL_PROGRESS' in printer.gcode.commands %}
        INVENTURE_LEVEL_PROGRESS
    {% elif 'inventure_leveling' in printer.configfile.settings %}
        INVENTURE_LEVEL_STATUS
    {% else %}
        {action_respond_info("Inventure: module inventure_leveling not loaded")}
    {% endif %}

[gcode_macro INVENTURE_KLIPPER_MENU]
description: Open the shared Klipper control menu in Fluidd and on the OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=klipper_main

[gcode_macro INVENTURE_MAINTENANCE]
description: Open all Zortrax Inventure maintenance procedures
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=maintenance

[gcode_macro INVENTURE_MATERIAL_MENU]
description: Open the shared model and support material menu
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=material
