# Inventure R38 field recovery profile, recovered from the 2026-11-23 Klipper log.
# This contains the last recorded explicit machine settings, not saved JSON data.
# Source effective-configuration SHA256: de28b501673654dbdc2f564877b357336d1a9a22b00ae1745a3b741c8602f03a
# The log identified MCU R15; that is historical evidence, not the current MCU.
# Host R38.6 Home All/Home Z requires the matching MCU R16 capability flags.
# Install only through the explicit --restore-field-profile migration action.
# UART and G-code paths below are placeholders, replaced by the staged installer.
# Published macros are supplied by the current installer and retain the shared
# Inventure/M300 file layout, physical OLED navigation, and Fluidd actions.
# Saved operator JSON files must be copied from the existing host when available.
# No delayed G-code or automatic homing/heating is part of this profile.

[mcu]
serial: /dev/ttyS5
baud: 750000
restart_method = command
[inventure_mcu]
mcu = mcu
diagnostic_adc = True
allow_actuators = True
[printer]
kinematics = corexy
max_velocity = 30
max_accel = 200
max_z_velocity = 8.3
max_z_accel = 20
square_corner_velocity = 2
[idle_timeout]
timeout = 900
[stepper_x]
step_pin = PA7
dir_pin = PB2
enable_pin = PE10
microsteps = 16
rotation_distance = 5
endstop_pin = ^PB11
position_endstop = 0
position_min = 0
position_max = 138
homing_speed = 5
homing_retract_dist = 1
second_homing_speed = 2
step_pulse_duration = 0.000004
[stepper_y]
step_pin = PA6
dir_pin = PB1
enable_pin = PE10
microsteps = 16
rotation_distance = 5
endstop_pin = ^PC15
position_endstop = 0
position_min = 0
position_max = 138
homing_speed = 5
homing_retract_dist = 1
second_homing_speed = 2
step_pulse_duration = 0.000004
[stepper_z]
step_pin = PB8
dir_pin = !PE7
enable_pin = PE10
microsteps = 16
rotation_distance = 3.99002493766
endstop_pin = ^PE12
position_endstop = 139.35
position_min = -0.70
position_max = 139.35
homing_positive_dir = True
homing_speed = 8.2849
homing_retract_dist = 0
step_pulse_duration = 0.000004
[extruder]
nozzle_diameter = 0.4
filament_diameter = 1.75
max_extrude_only_distance = 0
[include inventure_cooling.cfg]
[include inventure_services.cfg]
[include inventure_base.cfg]
[heater_generic inventure_t1]
[pause_resume]
[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
[heater_generic chamber_l]
[include inventure_heater_monitors.cfg]
[heater_generic chamber_r]
[include inventure_chamber.cfg]
[include inventure_display.cfg]
[include inventure_temperature_sensors.cfg]

[include inventure_heater_control.cfg]

[include inventure_operations.cfg]
[include klipper_calibration.cfg]

[include inventure_heaters.cfg]

