# Inventure V9 RC7.1 / Fluidd section 01 — read-only. Include only once.
# Macro prefixes INV_D_, INV_O_, INV_M_, INV_C_ are stable for UI grouping.
# Commands below are exact Klipper G-code names; not internal MCU messages.

[gcode_macro INV_D_WERSJE]
description: Inventure / wersja aplikacji MCU, bootloader i ustawienie UART P4
gcode:
    INVENTURE_VERSION

[gcode_macro INV_D_STATUS]
description: Inventure / stan MCU, fault, ADC, wentylatory, UART i wejscia
gcode:
    INVENTURE_STATUS

[gcode_macro INV_D_WEJSCIA]
description: Inventure / 16 wejsc i stan przyciskow
gcode:
    INVENTURE_INPUTS

[gcode_macro INV_D_RFID_UART]
description: Inventure / tylko odczyt kanalow UART kaset i licznikow bledow
gcode:
    INVENTURE_RFID_STATUS

[gcode_macro INV_D_RFID_KASETY]
description: Inventure / stan logiki RFID kaset, bez zapisu tagow
gcode:
    {% if 'inventure_rfid' in printer.configfile.settings %}
        INVENTURE_RFID_CLIENT_STATUS
    {% else %}
        {action_respond_info("Inventure: module inventure_rfid not loaded")}
    {% endif %}

