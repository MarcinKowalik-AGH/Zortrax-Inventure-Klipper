[gcode_macro INV_O_STATUS]
description: Show OLED session, acknowledgments, faults, and queues
gcode:
    INVENTURE_OLED_STATUS

[gcode_macro INV_O_MENU]
description: Show the current OEM menu page and selection
gcode:
