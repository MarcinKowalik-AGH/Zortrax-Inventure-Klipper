[gcode_macro INVENTURE_DISPLAY_STATUS]
description: Show OLED session, acknowledgments, faults, and queues
gcode:
    INVENTURE_OLED_STATUS

[gcode_macro INVENTURE_DISPLAY_MENU]
description: Show the current OEM menu page and selection
gcode:
    INVENTURE_MENU_STATUS

[gcode_macro INVENTURE_DISPLAY_TEXT_TEST]
description: Display test text on the OLED
gcode:
    INVENTURE_OLED_TEXT LINE1=INVENTURE LINE2=RC7_TEST

[gcode_macro INVENTURE_DISPLAY_REINIT]
description: Restart the host OLED session
gcode:
    INVENTURE_OLED_REINIT

