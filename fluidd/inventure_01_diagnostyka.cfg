[gcode_macro INVENTURE_PRINT_CHECK]
description: Run the P15 preflight check
gcode:
    {% if 'inventure_preflight' in printer.configfile.settings %}
        {% if not params.MANIFEST|default('') %}{action_raise_error('Provide a job MANIFEST')}{% endif %}
        INVENTURE_PREFLIGHT_CHECK MANIFEST="{params.MANIFEST}" {% if 'ACK' in params %}ACK={params.ACK}{% endif %}
    {% else %}
        {action_respond_info("Inventure: module inventure_preflight not loaded")}
    {% endif %}


