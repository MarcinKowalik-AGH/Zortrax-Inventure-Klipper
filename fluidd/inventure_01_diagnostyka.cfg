# Inventure V9 RC7.1 / Fluidd section 01 — read-only. Include only once.
# Inventure diagnostic buttons share the dashboard category.
# Commands below are exact Klipper G-code names; not internal MCU messages.

[gcode_macro INVENTURE_DIAG_VERSIONS]
description: MCU firmware version, bootloader, and UART P4 settings
gcode:
    INVENTURE_VERSION

[gcode_macro INVENTURE_DIAG_STATUS]
description: MCU status, faults, ADC readings, fans, UART, and inputs
gcode:
    INVENTURE_STATUS

[gcode_macro INVENTURE_DIAG_INPUTS]
description: Read the 16 inputs and button states
gcode:
    INVENTURE_INPUTS

[gcode_macro INVENTURE_DIAG_RFID_UART]
description: Read the cartridge UART channels and error counters
gcode:
    INVENTURE_RFID_STATUS

[gcode_macro INVENTURE_DIAG_RFID_CARTRIDGES]
description: Read cartridge RFID status
gcode:
    {% if 'inventure_rfid' in printer.configfile.settings %}
        INVENTURE_RFID_CLIENT_STATUS
    {% else %}
        {action_respond_info("Inventure: module inventure_rfid not loaded")}
    {% endif %}

[gcode_macro INVENTURE_DIAG_OPERATIONS]
description: Show P02 arbitration and operation status
gcode:
    {% if 'inventure_operations' in printer.configfile.settings %}
        INVENTURE_OPERATION_STATUS
    {% else %}
        {action_respond_info("Inventure: module inventure_operations not loaded")}
    {% endif %}

