description: Inventure / test tekstu na OLED bez ruchu i grzania
gcode:
    INVENTURE_OLED_TEXT LINE1=INVENTURE LINE2=RC7_TEST

[gcode_macro INV_O_REINIT]
description: Inventure / ponowne rozpoczecie sesji OLED hosta, bez restartu MCU
