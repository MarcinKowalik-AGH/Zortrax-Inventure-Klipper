# Inventure V9 RC7.1 / optional execution macros.
# DO NOT include before physical qualification of the relevant Inventure Pxx modules.
# These wrappers do NOT set new movement speeds/limits or override Fluidd's 150%.
# P02/P03/P04/P05/P09/P10/P13/P15/P16/P17 enforce original ownership.

[gcode_macro INV_R_HOME_X]
description: Inventure TEST / home X by qualified P03 (native Klipper)
gcode:
    G28 X

[gcode_macro INV_R_HOME_Y]
description: Inventure TEST / home Y by qualified P03 (native Klipper)
gcode:
    G28 Y

[gcode_macro INV_R_HOME_Z]
description: Inventure TEST / home Z, requires qualified P03 contact and safety
gcode:
    G28 Z

[gcode_macro INV_R_HOME_XY]
description: Inventure TEST / home X and Y, no automatic Z
gcode:
    G28 X Y

[gcode_macro INV_R_WYBIERZ_T0]
description: Inventure TEST / choose model nozzle through qualified P04
gcode:
    T0

[gcode_macro INV_R_WYBIERZ_T1]
description: Inventure TEST / choose support nozzle through qualified P04
gcode:
    T1

[gcode_macro INV_C_POZIOMUJ_START]
description: Inventure TEST / begin qualified five-point P09 wizard
gcode:
    INVENTURE_LEVEL_START

[gcode_macro INV_C_POZIOMUJ_DALEJ]
description: Inventure TEST / next P09 step after operator confirmation
gcode:
    INVENTURE_LEVEL_ADVANCE

[gcode_macro INV_C_POZIOMUJ_ANULUJ]
description: Inventure TEST / abort P09 without committing measurements
gcode:
    INVENTURE_LEVEL_CANCEL

[gcode_macro INV_C_ALIGN_START]
description: Inventure TEST / begin nozzle pattern P10
gcode:
    INVENTURE_ALIGN_START

[gcode_macro INV_C_ALIGN_ANULUJ]
description: Inventure TEST / abort P10 without commit
gcode:
    INVENTURE_ALIGN_CANCEL

[gcode_macro INV_M_FILAMENT_LOAD]
description: Inventure TEST / P13 load. Use own P13 parameters, qualification required
gcode:
    INVENTURE_FILAMENT_LOAD {rawparams}

[gcode_macro INV_M_FILAMENT_UNLOAD]
description: Inventure TEST / P13 unload. Use own P13 parameters, qualification required
gcode:
    INVENTURE_FILAMENT_UNLOAD {rawparams}

[gcode_macro INV_M_FILAMENT_CANCEL]
description: Inventure TEST / cancel P13 filament workflow
gcode:
    INVENTURE_FILAMENT_CANCEL

[gcode_macro INV_P_CYCLE_PAUSE]
description: Inventure TEST / P17 controlled pause
gcode:
    INVENTURE_CYCLE_PAUSE

[gcode_macro INV_P_CYCLE_RESUME]
description: Inventure TEST / P17 resume with interlock recheck
gcode:
    INVENTURE_CYCLE_RESUME

[gcode_macro INV_P_CYCLE_CANCEL]
description: Inventure TEST / P17 cancel, heater/fan policies unchanged
gcode:
    INVENTURE_CYCLE_CANCEL

[gcode_macro INV_F_TEST]
description: Inventure TEST / P06 fan test; requires fully qualified fan hardware
gcode:
    INVENTURE_FAN_TEST {rawparams}

[gcode_macro INV_F_TEST_STOP]
description: Inventure TEST / stop P06 fan test
gcode:
    INVENTURE_FAN_TEST_CANCEL
