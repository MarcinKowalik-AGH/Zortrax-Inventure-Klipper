# Operator controls for Fluidd and the Inventure OLED.

[gcode_macro INVENTURE_DIAGNOSTICS]
description: Report controller versions, panel inputs and cooling
gcode:
    INVENTURE_VERSION
    INVENTURE_PANEL_IO_STATUS
    INVENTURE_COOLING_STATUS

[gcode_macro INVENTURE_PRINTER_STATUS]
description: Show the Inventure controller state
gcode:
    INVENTURE_STATUS

[gcode_macro INVENTURE_PROCEDURES]
description: List the OEM procedures and show the current menu prompt
gcode:
    INVENTURE_PROCEDURE ACTION=LIST
    INVENTURE_ZORTRAX OP=STATUS

[gcode_macro INVENTURE_HELP]
description: Open Inventure help
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=help

[gcode_macro INVENTURE_FANS]
description: Read all six fan outputs, tachometers and the cooling policy
gcode:
    INVENTURE_PANEL_IO_STATUS
    INVENTURE_COOLING_STATUS

[gcode_macro INVENTURE_FAN_TEST_START]
description: Choose an Inventure fan on the OLED or through the menu controls
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=fan_test

[gcode_macro INVENTURE_FAN_TEST_END]
description: End the test and return fan outputs to their controller
gcode:
    INVENTURE_ZORTRAX OP=FAN_END

[gcode_macro INVENTURE_FAN_CHANNEL]
description: Inspect or test a numbered fan and record an observation
gcode:
    {% set action = params.ACTION|default('STATUS')|upper %}
    {% if action == 'STATUS' %}
        INVENTURE_FAN_MANUAL_STATUS
    {% else %}
        INVENTURE_FAN_MANUAL CHANNEL={params.CHANNEL} ACTION={action} ACK={params.ACK|default('')}
    {% endif %}

[gcode_macro INVENTURE_CHANGE]
description: Start filament exchange for the active print tool
gcode:
    INVENTURE_JAM_EXCHANGE

[gcode_macro INVENTURE_HEAT]
description: Heat or hold a nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=heat_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_CLEAN]
description: Wipe the selected nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=clean_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_NOZZLE_PURGE]
description: Purge and clean the selected nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=purge_{tool|lower} {% if 'TARGET' in params %}TARGET={params.TARGET}{% endif %}

[gcode_macro INVENTURE_NOZZLE_SELECT]
description: Select the working nozzle through the shared OLED menu
gcode:
    {% set tool = params.TOOL|default('T0')|upper %}
    {% if tool not in ['T0', 'T1'] %}{action_raise_error('Select TOOL=T0 or T1')}{% endif %}
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=select_{tool|lower}

[gcode_macro INVENTURE_MENU_CONFIRM]
description: Confirm the current OLED prompt with its token
gcode:
    INVENTURE_ZORTRAX OP=CONFIRM TOKEN={params.TOKEN}

[gcode_macro INVENTURE_MENU_CHOOSE]
description: Choose a numbered option from the current OLED prompt
gcode:
    INVENTURE_ZORTRAX OP=CHOOSE TOKEN={params.TOKEN} INDEX={params.INDEX}

[gcode_macro INVENTURE_MENU_BACK]
description: Go back one menu step
gcode:
    INVENTURE_ZORTRAX OP=BACK

[gcode_macro INVENTURE_LIGHT]
description: Set the three-bit chamber light mask (0 off, 7 white)
gcode:
    {% if 'MASK' in params %}
        INVENTURE_RGB MASK={params.MASK}
    {% else %}
        {action_respond_info('MASK=0 turns the light off. MASK=7 selects white.')}
    {% endif %}

[gcode_macro INVENTURE_MAIN_MENU]
description: Open the shared Inventure main menu in Fluidd and on the OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=root

[gcode_macro INVENTURE_SETTINGS]
description: Open the settings page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=settings

[gcode_macro INVENTURE_INFORMATION]
description: Open the information page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=information

[gcode_macro INVENTURE_LANGUAGE]
description: Open the language page on the physical OLED
gcode:
    INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=language

[gcode_macro INVENTURE_MODELS]
description: Browse the current virtual SD files through the menu
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=sd_browser

[gcode_macro INVENTURE_MODELS_SORT]
description: Select file sorting by date, name or size
gcode:
    {% set order = params.ORDER|default('')|lower %}
    {% if order in ['asc','desc','name','size'] %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=sort_{order}
    {% elif order %}
        {action_raise_error('Choose ORDER=ASC, DESC, NAME or SIZE')}
    {% else %}
        INVENTURE_DISPLAY_CONTROL PROMPT=1 PAGE=sorting
    {% endif %}

[gcode_macro INVENTURE_SCREEN]
description: Wake the physical OLED and report its current state
gcode:
    INVENTURE_DISPLAY_CONTROL WAKE=1
    INVENTURE_MENU_STATUS

[gcode_macro INVENTURE_OLED_BRIGHTNESS]
description: Read or save the awake OLED brightness, from 1 to 16
gcode:
    {% if 'LEVEL' in params %}
        INVENTURE_DISPLAY_CONTROL LEVEL={params.LEVEL}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_brightness PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_OLED_ICONS]
description: Browse the project animations on the Inventure OLED and Fluidd
gcode:
    INVENTURE_ZORTRAX OP=OPEN ACTION=oled_icons PROMPT=1 {% if params.NAME|default('') %}NAME={params.NAME}{% endif %}

[gcode_macro INVENTURE_SLEEP_MODE]
description: Read or save the OLED sleep setting
gcode:
    {% if 'ENABLED' in params %}
        INVENTURE_DISPLAY_CONTROL ENABLED={params.ENABLED}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_sleep_mode PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_OLED_TIMERS]
description: Set OLED dim and sleep times in minutes, or legacy idle and notice in seconds
gcode:
    {% if 'DIM' in params or 'SLEEP' in params or 'IDLE' in params or 'NOTICE' in params %}
        INVENTURE_DISPLAY_CONTROL {% if 'DIM' in params %}DIM={params.DIM}{% endif %} {% if 'SLEEP' in params %}SLEEP={params.SLEEP}{% endif %} {% if 'IDLE' in params %}IDLE={params.IDLE}{% endif %} {% if 'NOTICE' in params %}NOTICE={params.NOTICE}{% endif %}
    {% else %}
        INVENTURE_ZORTRAX OP=OPEN ACTION=oled_timers PROMPT=1
    {% endif %}

[gcode_macro INVENTURE_PLATFORM_UP]
description: Move the referenced platform up after confirmation (mm and mm/s)
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=platform_up DISTANCE={params.DISTANCE|default(1)} SPEED={params.SPEED|default(1)}

[gcode_macro INVENTURE_PLATFORM_DOWN]
description: Move the referenced platform down after confirmation (mm and mm/s)
gcode:
    INVENTURE_ZORTRAX OP=OPEN PROMPT=1 ACTION=platform_down DISTANCE={params.DISTANCE|default(1)} SPEED={params.SPEED|default(1)}
