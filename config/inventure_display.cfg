# Inventure configuration layout v1
# Inventure panel preferences. Times are in seconds. Sleep applies to the OLED.
[inventure_display]
# Timed dim/off mode, in the same order as m300_display.cfg.
timeout: 300
sleep_timeout: 900
normal_contrast: 159
dim_contrast: 32
notice_seconds: 10

# Inventure defaults. The native mode shows a notice after idle_timeout.
timer_policy: inventure
idle_timeout: 300
brightness: 16
sleep_light: manual
