# Include when T1 does not already have a native heater.
# Set heater: extruder, inventure_t1 in the existing F0, F2 and F3 heater_fan sections.
[heater_generic inventure_t1]
heater_pin: inventure_r5:HEATER_T1
sensor_type: Inventure R5 ADC
sensor_channel: 1
pwm_cycle_time: 0.0001066666666667
control: watermark
max_delta: 1.5
max_power: 0.40
min_temp: 0
max_temp: 310
