# Zortrax Inventure V9, probe commissioning with RC8-CONTROL-R7-Z-OEM-NATIVE.
# UART settings match the tested Orange Pi. Check them before switching profiles.
[mcu]
serial: /dev/ttyS1
baud: 750000
restart_method: command

[inventure_mcu]
mcu: mcu
diagnostic_adc: True
allow_actuators: True

[printer]
kinematics: corexy
max_velocity: 80
max_accel: 200
max_z_velocity: 20
max_z_accel: 20
square_corner_velocity: 2

[idle_timeout]
timeout: 900

[stepper_x]
step_pin: PA7
dir_pin: PB2
enable_pin: PE10
microsteps: 16
rotation_distance: 5
endstop_pin: ^PB11
position_endstop: 0
position_min: 0
position_max: 138
homing_speed: 5
homing_retract_dist: 1
second_homing_speed: 2
step_pulse_duration: 0.000004

[stepper_y]
step_pin: PA6
dir_pin: PB1
enable_pin: PE10
microsteps: 16
rotation_distance: 5
endstop_pin: ^PC15
position_endstop: 0
position_min: 0
position_max: 138
homing_speed: 5
homing_retract_dist: 1
second_homing_speed: 2
step_pulse_duration: 0.000004

[stepper_z]
step_pin: PB8
dir_pin: !PE7
enable_pin: PE10
microsteps: 16
rotation_distance: 3.99002493766
endstop_pin: ^PE12
position_endstop: 139.35
position_min: -0.70
position_max: 139.35
homing_positive_dir: True
homing_speed: 8.2849355018
homing_retract_dist: 0
step_pulse_duration: 0.000004

[extruder]
heater_pin: inventure_r5:HEATER_T0
sensor_type: Inventure R5 ADC
sensor_channel: 0
pwm_cycle_time: 0.0000469333333333
nozzle_diameter: 0.4
filament_diameter: 1.75
control: watermark
max_delta: 1.5
max_power: 0.40
min_temp: 0
max_temp: 220
max_extrude_only_distance: 0

[heater_fan head_cooling]
pin: inventure_r5:F0
cycle_time: 0.1
heater: extruder
heater_temp: 40

[heater_fan left_cooling]
pin: inventure_r5:F2
cycle_time: 0.1
heater: extruder
heater_temp: 40

[heater_fan right_cooling]
pin: inventure_r5:F3
cycle_time: 0.1
heater: extruder
heater_temp: 40

[inventure_native_z]
# First native G28 uses PB11/PC15 trigger coordinates. Verify the pad cold.
# Install INVENTURE_HOME.cfg and include it to enable the five homing macros.
pad_x: 82.8
pad_y: 68.0
bottom_position: 139.35
bottom_release: 6.2344139651
coarse_speed: 20
fine_speed: 0.3117206983
nozzle_temperature: 200

[inventure_oled]
spi_speed: 3750000
chunk_interval: 0.002
refresh_interval: 0.2
ack_timeout: 1.0
oem_menu: True
oem_language: en
oem_start_screen: klipper
menu_profile: m300
