# Include from the native CoreXY printer.cfg with [inventure_native_z] enabled.
[gcode_macro INVENTURE_HOME_X]
description: Home X with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=X')}{% endif %}
    INVENTURE_NATIVE_HOME AXES=X {rawparams}

[gcode_macro INVENTURE_HOME_Y]
description: Home Y with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=Y')}{% endif %}
    INVENTURE_NATIVE_HOME AXES=Y {rawparams}

[gcode_macro INVENTURE_HOME_XY]
description: Home Y then X with the platform clear of the nozzle
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=XY')}{% endif %}
    INVENTURE_NATIVE_HOME AXES=XY {rawparams}

[gcode_macro INVENTURE_HOME_Z]
description: Home heated T0 on the contact pad after XY is homed
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=Z')}{% endif %}
    INVENTURE_NATIVE_HOME AXES=Z {rawparams}

[gcode_macro INVENTURE_HOME_XYZ]
description: Home Y and X then establish Z with heated T0 on the contact pad
gcode:
    {% if 'AXES' in params %}{action_raise_error('This macro selects AXES=XYZ')}{% endif %}
    INVENTURE_NATIVE_HOME AXES=XYZ {rawparams}
