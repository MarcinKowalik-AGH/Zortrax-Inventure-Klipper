# Both native PID loops use the r0323 chamber profile. Klipper supplies
# the PID implementation and independent verify_heater monitors.
[heater_generic chamber_l]
heater_pin: inventure_r5:HEATER_PC9
sensor_type: Inventure R5 ADC
sensor_channel: 2
pwm_cycle_time: 0.139808
control: pid
pid_Kp: 22.2
pid_Ki: 0.25
pid_Kd: 228
smooth_time: 2
min_temp: -10
max_temp: 120
max_power: 1

[heater_generic chamber_r]
heater_pin: inventure_r5:HEATER_PC8
sensor_type: Inventure R5 ADC
sensor_channel: 3
pwm_cycle_time: 0.139808
control: pid
pid_Kp: 22.2
pid_Ki: 0.25
pid_Kd: 228
smooth_time: 2
min_temp: -10
max_temp: 120
max_power: 1

[inventure_chamber chamber]
left_heater: chamber_l
right_heater: chamber_r
max_temp: 90
