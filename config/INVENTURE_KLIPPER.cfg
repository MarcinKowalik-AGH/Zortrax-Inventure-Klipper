# Standard Klipper buttons. The installer includes controls supported by the active configuration.

[gcode_macro PID_HOTEND]
description: Tune one native R5 nozzle in NATIVE mode
gcode:
    INVENTURE_NATIVE_PID TOOL={params.TOOL|default("T0")} TARGET={params.TARGET|default(200)}

[gcode_macro PID_STATUS]
description: Show configured heaters, their control settings and pending PID changes
gcode:
    {% for name in printer.heaters.available_heaters %}
        {% set cfg = printer.configfile.settings[name] %}
        {action_respond_info('%s: %s, Kp=%s Ki=%s Kd=%s' % (name, cfg.control, cfg.pid_kp|default('-'), cfg.pid_ki|default('-'), cfg.pid_kd|default('-')))}
    {% endfor %}
    {action_respond_info('Pending SAVE_CONFIG items: %s' % printer.configfile.save_config_pending_items)}

[gcode_macro PID_SAVE]
description: Save pending Klipper PID results and restart the idle host
gcode:
    {% set status = namespace(pid=false) %}
    {% for name, options in printer.configfile.save_config_pending_items.items() %}
        {% set keys = (options or {})|map('lower')|list %}
            {% if 'pid_kp' in keys and 'pid_ki' in keys and 'pid_kd' in keys %}
            {% set status.pid = true %}
        {% endif %}
    {% endfor %}
    {% if not status.pid %}{action_raise_error('No completed PID tune is pending')}{% endif %}
    INVENTURE_NATIVE_IDLE
    SAVE_CONFIG

[gcode_macro OLED_TIMERS]
description: Open the OLED timers or set DIM/SLEEP (minutes) or IDLE/NOTICE (seconds)
gcode:
    INVENTURE_OLED_TIMERS {% if "DIM" in params %}DIM={params.DIM}{% endif %} {% if "SLEEP" in params %}SLEEP={params.SLEEP}{% endif %} {% if "IDLE" in params %}IDLE={params.IDLE}{% endif %} {% if "NOTICE" in params %}NOTICE={params.NOTICE}{% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the active print through Klipper and switch off the native heaters
rename_existing: _INVENTURE_CANCEL_BASE
gcode:
    _INVENTURE_CANCEL_BASE {rawparams}
    TURN_OFF_HEATERS

[gcode_macro END_PRINT]
description: Finish buffered native motion and turn off native print heaters and part cooling
gcode:
    INVENTURE_NATIVE_END

[gcode_macro BED_MESH]
description: Inspect, clear, or load an existing operator-configured mesh profile
gcode:
    {% set action = params.ACTION|default('STATUS')|upper %}
    {% set profile = params.PROFILE|default('') %}
    {% if action == 'STATUS' %}
        BED_MESH_OUTPUT
    {% elif action == 'CLEAR' %}
        INVENTURE_NATIVE_IDLE
        BED_MESH_CLEAR
    {% elif action == 'LOAD' and profile in printer.bed_mesh.profiles %}
        INVENTURE_NATIVE_IDLE
        BED_MESH_PROFILE LOAD="{profile}"
    {% else %}
        {action_raise_error('Use ACTION=STATUS, CLEAR or LOAD with an existing PROFILE')}
    {% endif %}

[gcode_macro PID_BED]
description: Tune a separately configured native bed heater
gcode:
    INVENTURE_NATIVE_IDLE
    PID_CALIBRATE HEATER=heater_bed TARGET={params.TARGET|default(60)}

[gcode_macro START_PRINT]
description: Launch the file bound to the single-use Inventure preflight token from the console
gcode:
    {% if not params.TOKEN|default('') or params.ACK|default('') != 'START_CHECKED_JOB' %}
        {action_raise_error('Run preflight and supply its TOKEN and ACK=START_CHECKED_JOB')}
    {% endif %}
    INVENTURE_PREFLIGHT_START TOKEN={params.TOKEN} ACK=START_CHECKED_JOB

[gcode_macro PID_CHAMBER]
description: Tune one chamber zone using its own thermometer
gcode:
    INVENTURE_CHAMBER_PID SIDE={params.SIDE|default("LEFT")} TARGET={params.TARGET|default(45)}

[gcode_macro M141]
description: Set both chamber zone targets
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)}

[gcode_macro M191]
description: Set both chamber zones and wait for both to heat
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)} WAIT=1
