[gcode_macro INVENTURE_LEVEL]
description: Start five-point Inventure platform leveling
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=START

[gcode_macro INVENTURE_LEVEL_NEXT]
description: Confirm the leveling knob adjustment
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if not run.awaiting_operator %}
        {action_raise_error('No leveling adjustment to confirm')}
    {% endif %}
    INVENTURE_PLATFORM_LEVEL ACTION=NEXT RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro INVENTURE_LEVEL_PROGRESS]
description: Show leveling progress, measurements, and adjustment instructions
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=STATUS

[gcode_macro INVENTURE_LEVEL_SAVE]
description: Save the current platform leveling result
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if run.phase != 'candidate' or not run.run_id %}
        {action_raise_error('No completed leveling result to save')}
    {% endif %}
    INVENTURE_PLATFORM_LEVEL ACTION=SAVE RUN_ID={params.RUN_ID|default(run.run_id)}

[gcode_macro INVENTURE_LEVEL_STOP]
description: Cancel platform leveling
gcode:
    INVENTURE_PLATFORM_LEVEL ACTION=CANCEL

[gcode_macro INVENTURE_DOOR_LOCK]
description: Show the global door and lid lock setting
gcode:
    INVENTURE_DOOR_POLICY MENU=1
