[gcode_macro ZORTRAX_LEVEL]
description: Rozpocznij fabryczne poziomowanie platformy Inventure w pięciu punktach
gcode:
    {% set tool = params.ACTIVE_TOOL|default('')|upper %}
    {% if tool == '' %}
        {action_respond_info('action:prompt_begin Poziomowanie platformy')}
        {action_respond_info('action:prompt_text Sprawdź, która dysza jest teraz fizycznie opuszczona. Wybór rozpocznie procedurę.')}
        {action_respond_info('action:prompt_text Temperatura zadana wynosi 200°C. Jeśli opuszczona jest T1, początkowo grzeją się obie dysze.')}
        {action_respond_info('action:prompt_button T0 opuszczona|ZORTRAX_LEVEL ACTIVE_TOOL=T0')}
        {action_respond_info('action:prompt_button T1 opuszczona|ZORTRAX_LEVEL ACTIVE_TOOL=T1')}
        {action_respond_info('action:prompt_show')}
    {% elif tool in ('T0', 'T1') %}
        {action_respond_info('action:prompt_end')}
        ZORTRAX_PLATFORM_LEVEL ACTION=START ACTIVE_TOOL={tool}
    {% else %}
        {action_raise_error('ACTIVE_TOOL musi wskazywać fizycznie opuszczoną dyszę T0 lub T1')}
    {% endif %}

[gcode_macro ZORTRAX_LEVEL_NEXT]
description: Potwierdź wykonanie instrukcji dotyczącej pokręteł
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if not run.awaiting_operator %}
        {action_raise_error('Brak instrukcji regulacji do potwierdzenia')}
    {% endif %}
    ZORTRAX_PLATFORM_LEVEL ACTION=NEXT RUN_ID={run.run_id} PROMPT_ID={run.prompt_id}

[gcode_macro ZORTRAX_LEVEL_STATUS]
description: Pokaż etap poziomowania, pomiary i instrukcje regulacji
gcode:
    ZORTRAX_PLATFORM_LEVEL ACTION=STATUS

[gcode_macro ZORTRAX_LEVEL_SAVE]
description: Zapisz wynik bieżącego poziomowania platformy
gcode:
    {% set run = printer.inventure_mcu.platform_level %}
    {% if run.phase != 'candidate' or not run.run_id %}
        {action_raise_error('Brak ukończonego pomiaru do zapisania')}
    {% endif %}
    ZORTRAX_PLATFORM_LEVEL ACTION=SAVE RUN_ID={params.RUN_ID|default(run.run_id)}

[gcode_macro ZORTRAX_LEVEL_CANCEL]
description: Przerwij poziomowanie platformy
gcode:
    ZORTRAX_PLATFORM_LEVEL ACTION=CANCEL
